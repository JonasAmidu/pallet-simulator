name: Baseline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check tracked generated files
        run: ./scripts/check-generated-files.sh

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Local smoke test
        run: ./scripts/smoke-local.sh

      - name: Ensure repo stays clean
        run: test -z "$(git status --short --untracked-files=normal)"

  baseline-container:
    runs-on: ubuntu-latest
    needs: baseline-local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked generated files
        run: ./scripts/check-generated-files.sh

      - name: Container smoke test
        run: ./scripts/smoke-compose.sh
